name: Build desktop installers

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  janusgraph-compatibility:
    name: JanusGraph ${{ matrix.janusgraph }} compatibility
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        janusgraph: ["1.1.0", "1.0.0"]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 8.11.0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Exercise WS, sessioned WS and HTTP against JanusGraph
        run: pnpm test:compat
        env:
          JANUSGRAPH_VERSION: ${{ matrix.janusgraph }}

  build:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS arm64
            os: macos-14
            artifact: macos-arm64
          - name: Windows x64
            os: windows-2022
            artifact: windows-x64
          - name: Linux x64
            os: ubuntu-22.04
            artifact: linux-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 8.11.0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install Linux packaging tools
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y fakeroot rpm xvfb
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm typecheck
      - name: Unit and integration tests
        run: pnpm test
      - name: Build installers
        run: pnpm make
      - name: Packaged application smoke test
        run: pnpm test:e2e
      - uses: actions/upload-artifact@v4
        with:
          name: janus-studio-${{ matrix.artifact }}
          path: apps/desktop/out/make/**
          if-no-files-found: error
          retention-days: 14
